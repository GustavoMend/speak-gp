name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle variant to assemble'
        required: false
        default: 'Release'

jobs:
  build:
    runs-on: macos-latest
    env:
      BUILD_VARIANT: ${{ github.event.inputs.build_type || 'Release' }}
      SIGNING_ALIAS: ${{ secrets.ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > app/android-release.keystore

      - name: Build ${{ env.BUILD_VARIANT }} APK
        working-directory: app
        run: ./gradlew --no-daemon assemble${{ env.BUILD_VARIANT }}

      - name: Align and sign APK
        working-directory: app
        env:
          SIGNING_ALIAS: ${{ env.SIGNING_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_DIR=app/build/outputs/apk/${{ env.BUILD_VARIANT,, }}
          UNSIGNED_APK=$(ls "$APK_DIR"/*-unsigned.apk)
          ALIGNED_APK="$APK_DIR"/app-release-aligned.apk
          SIGNED_APK="$APK_DIR"/app-release-signed.apk
          "$BUILD_TOOLS"/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS"/apksigner sign \
            --ks ../android-release.keystore \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass pass:"$SIGNING_KEY_PASSWORD" \
            --key-pass pass:"$SIGNING_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/app/build/outputs/apk/${{ env.BUILD_VARIANT,, }}/app-release-signed.apk
