name: Build and Publish Release APK

on:
  workflow_dispatch:


jobs:
  build:
    name: Build and Sign APK
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make Gradle Wrapper executable
      run: chmod +x ./gradlew

    - name: Setup signing config
      env:
        KEYSTORE_CONTENT: ${{ secrets.SIGNING_KEY }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_CONTENT" | base64 -d > keystore.jks
        echo "storeFile=keystore.jks" >> keystore.properties
        echo "storePassword=$KEY_PASSWORD" >> keystore.properties
        echo "keyAlias=$KEY_ALIAS" >> keystore.properties
        echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        ORG_GRADLE_PROJECT_storeFile: keystore.jks
        ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEY_PASSWORD }}
        ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.ALIAS }}
        ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 5

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
